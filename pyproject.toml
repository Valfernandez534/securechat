[project]
name = "securechat"
version = "0.1.0"
description = "Messagerie multi-utilisateurs sur TLS (projet DevSecOps EPITA)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
securechat-serveur = "securechat.server:main"
securechat-client = "securechat.client:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["securechat"]
