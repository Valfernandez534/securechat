image: python:3.12

stages:
  - lint
  - test
  - security

before_script:
  - pip install -q -r requirements-dev.txt

lint:
  stage: lint
  script:
    - ruff check securechat tests

tests:
  stage: test
  script:
    - pytest --cov=securechat --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

bandit:
  stage: security
  script:
    - bandit -r securechat

dependencies:
  stage: security
  script:
    - pip-audit -r requirements-dev.txt
