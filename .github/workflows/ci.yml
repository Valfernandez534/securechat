name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Ruff
        run: ruff check securechat tests

      - name: Tests et couverture
        run: pytest --cov=securechat --cov-report=term

      - name: Bandit
        run: bandit -r securechat

      - name: Pip-audit
        run: pip-audit -r requirements.txt
